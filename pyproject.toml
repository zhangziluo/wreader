# wreader -- a terminal novel reader.
#
# Build/install (editable):  pip install -e .
# Console script afterwards:  werd --help
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wreader"
version = "0.1.0"
description = "A terminal novel reader with translation, vocabulary notebook, reading statistics and achievements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["reader", "novel", "epub", "txt", "terminal", "translation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
# NOTE: `curses` ships with the Python standard library on macOS/Linux, so it is
# intentionally NOT listed as a dependency here. Windows needs the extra below:
#   pip install -e ".[windows]"
dependencies = [
    "chardet",
    "rich",
    # The default translation engine (`google`) is built on this, so removing it
    # would break translation out of the box -- it stays a required dependency.
    # `requests` carries the four HTTP engines (baidu / youdao / tencent / deepseek).
    "deep-translator",
    "requests",
]

[project.optional-dependencies]
# Optional translation engines. `local` (Argos Translate) is the only heavy one --
# its language models are hundreds of megabytes -- so it is opt-in:
#   pip install -e ".[local]"
local = ["argostranslate"]
windows = ["windows-curses"]
dev = ["pytest>=8"]

[project.scripts]
werd = "wreader.cli:main"

[tool.setuptools.packages.find]
include = ["wreader*"]

[tool.setuptools.package-data]
wreader = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Static type checking: `npx pyright` (or `python -m pyright`) reads this section,
# so a fresh clone reproduces the same 0-diagnostic result in CI.
# NOTE: the Pylance extension ignores [tool.pyright] -- VS Code is pointed at the
# same virtualenv through .vscode/settings.json instead.
[tool.pyright]
include = ["wreader", "tests", "tools"]
exclude = [".venv", "build", "dist", "*.egg-info"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
